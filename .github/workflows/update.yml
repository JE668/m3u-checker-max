name: Update IPTV Links

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行核心检测与模板进化脚本
        run: python main.py

      - name: 提交并推送到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 必须存在的输出文件
          git add config/demo.txt output/live.txt output/live.m3u output/epg.xml output/epg.xml.gz output/log.txt

          # 可选文件：unmatched.txt 仅在存在时才添加
          [ -f output/unmatched.txt ] && git add output/unmatched.txt || true

          if ! git diff --staged --quiet; then
            git commit -m "Auto Update IPTV Sources: $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          else
            echo "没有发现任何变更，跳过提交。"
          fi
